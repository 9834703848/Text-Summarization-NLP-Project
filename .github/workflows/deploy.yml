name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3
      
      - name: Deploy
        run: |
          cd /home/ubuntu/Text-Summarization-NLP-Project
          git pull
          source venv/bin/activate
          pip install -r requirements.txt
          sudo systemctl restart text-summarizer
