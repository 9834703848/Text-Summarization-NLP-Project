<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Summarizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 1200px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .input-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .box {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        textarea {
            width: 100%;
            height: 300px;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            resize: vertical;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        #summary {
            background-color: #f8f9fa;
        }

        .button-container {
            text-align: center;
            margin-top: 20px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 50px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            box-shadow: none;
        }

        .spinner {
            display: none;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-left: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            color: #e74c3c;
            text-align: center;
            margin-top: 10px;
            font-weight: 600;
        }

        .char-count {
            text-align: right;
            color: #666;
            font-size: 0.9em;
            margin-top: 5px;
        }

        @media (max-width: 768px) {
            .input-section {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 2em;
            }

            .container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✨ Text Summarizer</h1>
        <p class="subtitle">Transform long texts into concise summaries using AI</p>
        
        <div class="input-section">
            <div class="box">
                <label for="dialogue">📝 Input Text</label>
                <textarea 
                    id="dialogue" 
                    placeholder="Enter your text here to summarize... (e.g., dialogues, articles, documents)"
                    oninput="updateCharCount()"
                ></textarea>
                <div class="char-count" id="charCount">0 characters</div>
            </div>
            
            <div class="box">
                <label for="summary">📋 Summary</label>
                <textarea 
                    id="summary" 
                    placeholder="Your summary will appear here..."
                    readonly
                ></textarea>
            </div>
        </div>
        
        <div class="button-container">
            <button onclick="summarize()" id="summarizeBtn">
                Summarize
                <span class="spinner" id="spinner"></span>
            </button>
        </div>
        
        <div class="error" id="error"></div>
    </div>

    <script>
        function updateCharCount() {
            const text = document.getElementById('dialogue').value;
            const count = text.length;
            document.getElementById('charCount').textContent = `${count} characters`;
        }

        async function summarize() {
            const dialogueText = document.getElementById('dialogue').value.trim();
            const summaryBox = document.getElementById('summary');
            const errorDiv = document.getElementById('error');
            const button = document.getElementById('summarizeBtn');
            const spinner = document.getElementById('spinner');
            
            // Clear previous results
            summaryBox.value = '';
            errorDiv.textContent = '';
            
            // Validation
            if (!dialogueText) {
                errorDiv.textContent = 'Please enter some text to summarize!';
                return;
            }
            
            // Show loading state
            button.disabled = true;
            spinner.style.display = 'inline-block';
            summaryBox.value = 'Generating summary...';
            
            try {
                // Create form data
                const formData = new FormData();
                formData.append('text', dialogueText);
                
                // Make API call
                const response = await fetch('/predict', {
                    method: 'POST',
                    body: formData
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                
                // Display result
                summaryBox.value = data.summary || 'No summary generated.';
                
            } catch (error) {
                console.error('Error:', error);
                errorDiv.textContent = 'An error occurred while generating the summary. Please try again.';
                summaryBox.value = '';
            } finally {
                // Reset loading state
                button.disabled = false;
                spinner.style.display = 'none';
            }
        }
        
        // Allow Enter key in textarea but submit with Ctrl+Enter
        document.getElementById('dialogue').addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'Enter') {
                summarize();
            }
        });
    </script>
</body>
</html>
